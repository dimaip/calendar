name: iOS release

on:
    workflow_dispatch:
        inputs:
            target:
                description: "TestFlight upload or App Store review with automatic release"
                type: choice
                options:
                    - testflight
                    - app-store
                default: testflight
            version:
                description: "iOS version (for example, 1.0.46)"
                type: string
                required: true
            notes:
                description: "Release notes (required for App Store)"
                type: string
            build_number:
                description: "Existing TestFlight build to submit (App Store only, optional)"
                type: string

            phased_release:
                description: "Release the App Store update in phases"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ios-release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/master'
        runs-on: macos-26
        timeout-minutes: 60
        environment: App Store
        env:
            BUNDLE_FROZEN: "true"
            FASTLANE_SKIP_UPDATE_CHECK: "true"
            FASTLANE_OPT_OUT_USAGE: "true"
            IOS_RELEASE_TARGET: ${{ inputs.target }}
            IOS_VERSION: ${{ inputs.version }}
            IOS_RELEASE_NOTES: ${{ inputs.notes }}
            IOS_BUILD_NUMBER: ${{ inputs.build_number }}
            IOS_PHASED_RELEASE: ${{ inputs.phased_release }}
            DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        steps:
            - name: Validate release inputs and credentials
              env:
                  ASC_READY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY != '' }}
                  SIGNING_READY: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROFILE_BASE64 != '' }}
              run: |
                  if ! [[ "$IOS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "::error::Enter a version with three numbers, for example 1.0.46."
                      exit 1
                  fi
                  if [[ "$IOS_RELEASE_TARGET" == app-store ]] && ! [[ "$IOS_RELEASE_NOTES" =~ [^[:space:]] ]]; then
                      echo "::error::App Store releases require release notes."
                      exit 1
                  fi
                  if [[ -n "$IOS_BUILD_NUMBER" ]] && { [[ "$IOS_RELEASE_TARGET" != app-store ]] || ! [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2}){0,2}$ ]]; }; then
                      echo "::error::An existing build number is accepted only for App Store submissions."
                      exit 1
                  fi
                  if [[ "$ASC_READY" != true ]]; then
                      echo "::error::Set ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY in the App Store environment."
                      exit 1
                  fi
                  if [[ -z "$IOS_BUILD_NUMBER" && "$SIGNING_READY" != true ]]; then
                      echo "::error::Set IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, and IOS_PROFILE_BASE64 in the App Store environment."
                      exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Install iOS release tools
              working-directory: ios
              run: bundle install
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              if: inputs.build_number == ''
              with:
                  node-version-file: .nvmrc
            - name: Build and sync web assets
              if: inputs.build_number == ''
              run: |
                  yarn install --frozen-lockfile
                  yarn build-aws
                  BUNDLE_GEMFILE="$PWD/ios/Gemfile" bundle exec yarn cap sync ios
            - name: Install distribution certificate
              if: inputs.build_number == ''
              env:
                  IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
                  IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
                  IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
              run: |
                  umask 077
                  certificate="$RUNNER_TEMP/distribution.p12"
                  keychain="$RUNNER_TEMP/ios-release.keychain-db"
                  profile="$RUNNER_TEMP/distribution.mobileprovision"
                  keychain_password="$(openssl rand -hex 32)"

                  trap 'rm -f "$certificate"' EXIT
                  printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
                  printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$profile"
                  security create-keychain -p "$keychain_password" "$keychain"
                  security set-keychain-settings -lut 3600 "$keychain"
                  security unlock-keychain -p "$keychain_password" "$keychain"
                  security import "$certificate" -k "$keychain" -f pkcs12 -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
                  security list-keychains -d user -s "$keychain"
                  printf 'IOS_PROFILE_PATH=%s\n' "$profile" >> "$GITHUB_ENV"
            - name: Upload or submit the release
              working-directory: ios
              env:
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_KEY: ${{ secrets.ASC_KEY }}
                  IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_USES_NON_EXEMPT_ENCRYPTION }}
                  IOS_ENCRYPTION_COMPLIANCE_CODE: ${{ vars.IOS_ENCRYPTION_COMPLIANCE_CODE }}
              run: bundle exec fastlane ios release
