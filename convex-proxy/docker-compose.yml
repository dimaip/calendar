services:
  convex-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      CONVEX_PROXY_PORT: 80
      CONVEX_UPSTREAM_HOST: expert-marmot-529.convex.cloud
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
