app = "molitva-convex-proxy"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  CONVEX_PROXY_PORT = "8080"
  CONVEX_UPSTREAM_HOST = "expert-marmot-529.convex.cloud"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
