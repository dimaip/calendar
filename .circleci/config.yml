version: 2.1
jobs:
    build:
        docker:
            - image: cimg/node:24.18.0
        steps:
            - checkout
            - run: sudo npm install --global yarn@1.22.22 --force
            - restore_cache:
                  keys:
                      - frontend-node24-v1-{{ checksum "yarn.lock" }}
            - run: yarn install --frozen-lockfile
            - save_cache:
                  key: frontend-node24-v1-{{ checksum "yarn.lock" }}
                  paths: [~/.cache/yarn]
            - run: git fetch origin 4b2db35575a80db33eb09ddf70a8ee4c440d0369
            - run: yarn verify:scope
            - run: yarn test && yarn test:tooling
            - run: yarn quality
            - run: yarn build
workflows:
    frontend:
        jobs: [build]
